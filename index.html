    <!-- Critical CSS inline for above-the-fold content -->
    <style>
      /* Critical CSS - Above the fold styles */
      :root {
        --background: 15 100% 98%;
        --foreground: 0 0% 20%;
        --primary: 330 100% 71%;
        --primary-foreground: 0 0% 100%;
        --muted-foreground: 0 0% 40%;
        --border: 350 30% 90%;
        --gradient-hero: linear-gradient(180deg, hsl(350 100% 96%) 0%, hsl(15 100% 98%) 100%);
        --gradient-primary: linear-gradient(135deg, hsl(330 100% 60%) 0%, hsl(350 100% 75%) 100%);
        --gradient-cta: linear-gradient(135deg, hsl(330 100% 50%) 0%, hsl(330 100% 71%) 50%, hsl(350 100% 80%) 100%);
        --shadow-cta: 0 8px 30px -8px hsl(330 100% 50% / 0.4);
        --green-success: 145 63% 42%;
      }
      
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      
      html { scroll-behavior: smooth; }
      
      body {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: hsl(15 100% 98%);
        color: hsl(0 0% 20%);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
      }
      
      /* Header critical styles */
      .header-critical {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(4px);
        padding: 0.75rem 0;
      }
      
      /* Hero section critical styles */
      .hero-critical {
        position: relative;
        padding-top: 5rem;
        padding-bottom: 2rem;
        overflow: hidden;
      }
      
      .hero-critical::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--gradient-hero);
        z-index: 0;
      }
      
      /* H1 critical styles - LCP element */
      .h1-critical {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 1.5rem;
        line-height: 1.2;
        font-weight: 700;
        text-align: center;
        color: hsl(0 0% 20%);
        margin-bottom: 0.75rem;
        padding: 0 0.5rem;
      }
      
      @media (min-width: 768px) {
        .h1-critical {
          font-size: 2.25rem;
        }
      }
      
      .text-gradient-pink {
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      /* CTA button critical */
      .btn-cta-critical {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        font-size: 0.875rem;
        padding: 1rem 2rem;
        border-radius: 9999px;
        color: white;
        background: var(--gradient-cta);
        box-shadow: var(--shadow-cta);
        text-decoration: none;
        border: none;
        cursor: pointer;
        white-space: nowrap;
      }
      
      /* Hide content until React loads */
      #root:empty::before {
        content: '';
        display: block;
        min-height: 100vh;
      }
    </style>
  </head>
